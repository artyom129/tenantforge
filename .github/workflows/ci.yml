name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tenantforge_test
          POSTGRES_USER: tenantforge
          POSTGRES_PASSWORD: tenantforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tenantforge -d tenantforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://tenantforge:tenantforge@localhost:5432/tenantforge_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: tenantforge-ci-jwt-secret-at-least-32-bytes
      BILLING_WEBHOOK_SECRET: tenantforge-ci-billing-secret
      TEST_USE_EXTERNAL_SERVICES: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q
